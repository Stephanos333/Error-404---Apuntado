# CI/CD pipeline of the Apuntado system (Deliverable 3, chapter 4).
#
# Stages (all of them blocking):
#   architecture  fitness functions FF-01..FF-06 in ratchet and strict mode + metrics (Ca, Ce, I, A, D, CC)
#   backend       tsc · unit tests with coverage · concurrency e2e (in-memory replica set) · nest build
#   frontend      lint · Vitest tests · tsc + vite build
#   containers    image build and smoke test with docker compose (mongodb rs0 → mongo-init → backend → frontend)
#   deploy        only on push to main with every stage green: triggers the Render deploy hooks
name: CI/CD

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/architecture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/architecture/package-lock.json
      - run: npm ci
      # Ratchet mode: blocks the merge if a new architectural violation appears.
      - name: Fitness functions (ratchet mode)
        run: npm test
      # Strict mode: blocks the merge if any violation exists (the baseline is empty).
      - name: Fitness functions (strict mode)
        run: npm run test:strict
      # Structural metrics: published in the job summary and as an artifact.
      - name: Architecture metrics (CC, Ca, Ce, I, A, D)
        run: npm run metrics
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-metrics
          path: docs/metricas/

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies (frozen lockfile)
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit, contract and edge case tests (with coverage)
        run: npx jest --ci --coverage --coverageReporters=text-summary --coverageReporters=lcov
      - name: MongoDB binaries cache (mongodb-memory-server)
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
      - name: Concurrency e2e tests (in-memory replica set)
        run: npm run test:e2e -- --ci
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/lcov-report/

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies (frozen lockfile)
        run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint
      - name: Board logic tests (Vitest)
        run: yarn test
      - name: Build (tsc + vite build)
        run: yarn build

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    env:
      # Test secrets: they only exist inside the ephemeral runner.
      JWT_SECRET: ci-jwt-secret-${{ github.run_id }}
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Build the images and start the whole system
        run: docker compose up -d --build
      - name: Smoke test (backend, SPA and Nginx proxy)
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsSL -o /dev/null http://localhost:3000/docs \
              && curl -fsSL -o /dev/null http://localhost:5173/ \
              && curl -fsSL -o /dev/null http://localhost:5173/docs; then
              echo "System available after ${attempt} attempt(s)."
              break
            fi
            sleep 5
          done
          curl -fsSL -o /dev/null http://localhost:3000/docs
          curl -fsSL http://localhost:5173/ | grep -q '<div id="root">'
          curl -fsSL -o /dev/null http://localhost:5173/docs
          docker compose ps
          test "$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -a -q mongo-init)")" = "0"
      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color
      - name: Stop and remove volumes
        if: always()
        run: docker compose down -v

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [architecture, backend, frontend, containers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger the Render deploy
        env:
          HOOK_BACKEND: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
          HOOK_FRONTEND: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          if [ -z "$HOOK_BACKEND" ] || [ -z "$HOOK_FRONTEND" ]; then
            echo "::warning::The RENDER_DEPLOY_HOOK_BACKEND / RENDER_DEPLOY_HOOK_FRONTEND secrets are missing: skipping the deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK_BACKEND" > /dev/null
          curl -fsS -X POST "$HOOK_FRONTEND" > /dev/null
          echo "Deploy requested on Render (backend and frontend)."
