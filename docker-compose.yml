# Apuntado system: the whole environment with a single command.
#   docker compose up --build        (or ./start.sh / start.bat)
#
# Services:
#   mongodb     MongoDB 7 as a single-node replica set (rs0): the multi-document transactions
#               that charge the bets and pay the pot require it (ADR-04).
#   mongo-init  One-off task: data migration, $jsonSchema validators + indexes (docs/schemas) and design catalog.
#   backend     NestJS built in production mode: REST (/api), WebSockets (/socket.io) and Swagger (/docs).
#   frontend    React SPA served by Nginx, with a reverse proxy to the backend.
#
# Variables: read from ./.env (template in .env.example). JWT_SECRET and JWT_REFRESH_SECRET are required.

name: apuntado

services:
  mongodb:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set the first time and only reports "healthy" once the node is PRIMARY.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { quit(rs.status().myState === 1 ? 0 : 1) } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }); quit(1) }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  mongo-init:
    image: mongo:7.0
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      # The same URI the backend uses: when it points to Atlas, the validators are applied there.
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/apuntado?replicaSet=rs0}
    volumes:
      - ./docs/schemas:/docs/schemas:ro
      - ./docker/mongo:/docker/mongo:ro
    entrypoint: ["bash", "/docker/mongo/init.sh"]
    restart: "no"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    environment:
      APP_PORT: 3000
      APP_URL: ${BACKEND_PUBLIC_URL:-http://localhost:3000}
      APP_GLOBAL_PREFIX: api
      APP_DOCS_URI: docs
      APP_DEFAULT_TOKENS: ${APP_DEFAULT_TOKENS:-100}
      APP_FALSE_WIN_PENALTY_POINTS: ${APP_FALSE_WIN_PENALTY_POINTS:-3}
      APP_BONUS_POINTS: ${APP_BONUS_POINTS:-10}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/apuntado?replicaSet=rs0}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (run start.sh or start.bat to generate it)}
      JWT_EXPIRATION_TIME: ${JWT_EXPIRATION_TIME:-6h}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env (run start.sh or start.bat to generate it)}
      JWT_REFRESH_EXPIRATION_TIME: ${JWT_REFRESH_EXPIRATION_TIME:-10d}
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  frontend:
    build:
      context: ./frontend
      args:
        # Empty = same origin: Nginx forwards /api and /socket.io to the backend.
        VITE_BACKEND_BASE_URL: ${VITE_BACKEND_BASE_URL:-}
        VITE_FRONTEND_BASE_URL: ${VITE_FRONTEND_BASE_URL:-http://localhost:5173}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  mongo-data:
