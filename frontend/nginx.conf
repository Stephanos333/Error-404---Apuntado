# Nginx for the Apuntado SPA: static files + reverse proxy to the NestJS backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend REST API (global prefix APP_GLOBAL_PREFIX=api).
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO (namespace /game): the connection must be upgraded to WebSocket.
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # OpenAPI (Swagger) documentation of the backend.
    location /docs {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    # Static files with a long cache (Vite generates hashed names).
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA routes (react-router): any other route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
