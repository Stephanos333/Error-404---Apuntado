# Nginx para la SPA de Apuntado: estáticos + proxy inverso hacia el backend NestJS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API REST del backend (prefijo global APP_GLOBAL_PREFIX=api).
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO (namespace /game): requiere actualizar la conexión a WebSocket.
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Documentación OpenAPI (Swagger) del backend.
    location /docs {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    # Estáticos con caché larga (Vite genera nombres con hash).
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Rutas de la SPA (react-router): cualquier otra ruta sirve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
